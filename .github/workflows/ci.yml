# .github/workflows/ci.yml
#
# Continuous-integration workflow. Runs on every push to any branch and on
# every pull request targeting main.
#
# What it does:
#   - lint:    golangci-lint over the Go code; actionlint over the workflow
#              files themselves (catches YAML / Action-syntax bugs locally).
#   - test:    go test with -race, -count=1 (no caching), and govulncheck.
#   - build:   builds the container image to confirm the Dockerfile is still
#              healthy. Does NOT push and does NOT attest -- those only happen
#              on tagged release builds (see release.yml).
#
# Triggers are intentionally conservative: skip-ci on documentation-only pushes
# would be nice-to-have but is omitted here so doc-impacting changes (link
# anchors, example commands) still get the build sanity check.

name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]
  schedule:
    # Daily at 05:37 UTC. The govulncheck step in the test job is only as
    # fresh as the last run: a stdlib advisory published during a quiet week
    # goes unnoticed until someone happens to push. Re-running the pipeline
    # daily re-asks the question against the current vulnerability database.
    # Off-the-hour minute to avoid GitHub's scheduler thundering herd.
    - cron: '37 5 * * *'

permissions:
  contents: read

# Cancel any in-progress run when a new push to the same branch arrives.
# Saves runner minutes on rapid iteration; harmless because CI is read-only.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Install office_oxide header for cgo typecheck
        # office_oxide's Go binding does `#include "office_oxide.h"` in its
        # cgo preamble — unlike pdf_oxide, which inlines its C function
        # prototypes in the preamble itself and therefore needs no custom
        # header at typecheck time. golangci-lint runs cgo with the default
        # CGO_ENABLED=1, so the preamble must compile, which means the
        # header has to be on the include path even though lint never links
        # against the library.
        #
        # We only fetch the header (~12 KB), not the full release tarball
        # or the static archive — the test job below installs the complete
        # library because it actually builds and links. This keeps the
        # lint job fast and avoids dragging the upstream-installer
        # workaround into a job that doesn't need it.
        run: |
          OFFICE_OXIDE_VERSION="$(go list -m -f '{{.Version}}' github.com/yfedoseev/office_oxide/go)"
          HEADER_DIR="${HOME}/.cache/office_oxide_header"
          mkdir -p "${HEADER_DIR}"
          curl --proto =https --tlsv1.2 -fsSL \
            "https://raw.githubusercontent.com/yfedoseev/office_oxide/${OFFICE_OXIDE_VERSION}/include/office_oxide_c/office_oxide.h" \
            -o "${HEADER_DIR}/office_oxide.h"
          echo "CGO_CFLAGS=-I${HEADER_DIR}" >> "$GITHUB_ENV"

      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          # Pinned instead of `latest`: with `latest` a new golangci-lint
          # release can turn CI red (or green) with no code change, so a green
          # run wouldn't prove the code passes the linter version you'll ship
          # with. This is a free-form action input, not a `uses:` ref, so
          # Dependabot does NOT bump it -- update this line by hand when you
          # want a newer linter (or move golangci-lint into a go.mod `tool`
          # directive and invoke the binary directly to get it tracked).
          #
          # v2.13.2 is the first release built with Go 1.27 (its release
          # workflow sets GO_VERSION: 1.27.0). golangci-lint refuses to lint a
          # module whose `go` directive targets a newer language version than
          # the linter itself was built with, so this must move in step with the
          # go.mod `go` directive (now go 1.27.0) -- v2.12.2 was built with Go
          # 1.26 and errors out with "the Go language version (go1.26) ... is
          # lower than the targeted Go version (1.27.0)".
          version: v2.13.2
          # --timeout because the WASM-backed transitive deps make first-run
          # analysis a bit slow on cold cache. Tune downward later if you want.
          args: --timeout=5m

      - name: actionlint
        # Linting the workflow files themselves catches a class of bug that
        # only surfaces when GitHub tries to schedule the run.
        #
        # Both the installer script and the actionlint version are pinned. The
        # previous form curled the script from the `main` branch and installed
        # whatever version was newest at run time -- a mutable ref executed via
        # bash, which is exactly the supply-chain shape SHA-pinning elsewhere in
        # this repo is meant to avoid. The URL now points at an immutable
        # release tag and the version is passed explicitly, so this step is
        # reproducible. (Stronger still: install actionlint via a go.mod `tool`
        # directive so Dependabot tracks it; left as a follow-up because it
        # needs a go.sum update.)
        env:
          ACTIONLINT_VERSION: 1.7.12
        run: |
          bash <(curl -sL "https://raw.githubusercontent.com/rhysd/actionlint/v${ACTIONLINT_VERSION}/scripts/download-actionlint.bash") "${ACTIONLINT_VERSION}"
          ./actionlint -color

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Install pdf_oxide native library
        run: |
          PDF_OXIDE_VERSION="$(go list -m -f '{{.Version}}' github.com/yfedoseev/pdf_oxide/go)"
          echo "Installing pdf_oxide ${PDF_OXIDE_VERSION}"
          go run "github.com/yfedoseev/pdf_oxide/go/cmd/install@${PDF_OXIDE_VERSION}"
          # The installer puts the library at a predictable path. Constructing
          # the cgo flags here (instead of forwarding the installer's stdout
          # to $GITHUB_ENV) avoids a quoting pitfall: $GITHUB_ENV treats every
          # `KEY=VALUE` as a single value and does not re-tokenize on spaces,
          # so the multi-flag CGO_LDFLAGS value arrives at gcc as one blob.
          INSTALL_DIR="${HOME}/.cache/pdf_oxide/${PDF_OXIDE_VERSION}"
          echo "PDF_OXIDE_INSTALL_DIR=${INSTALL_DIR}" >> "$GITHUB_ENV"

      - name: Install office_oxide native library
        # Upstream's `go run .../cmd/install` is currently broken (asset URL
        # mismatch — installer fetches `${name}-${ver}.tar.gz`, GitHub
        # publishes `${name}.tar.gz`), so we download the release archive
        # directly. The archive layout (`./lib/lib*.{a,so}`, `./include/...`)
        # is documented in office_oxide's release.yml. Revert to a `go run`
        # once a fixed installer ships upstream.
        run: |
          OFFICE_OXIDE_VERSION="$(go list -m -f '{{.Version}}' github.com/yfedoseev/office_oxide/go)"
          echo "Installing office_oxide ${OFFICE_OXIDE_VERSION}"
          INSTALL_DIR="${HOME}/.cache/office_oxide/${OFFICE_OXIDE_VERSION}"
          mkdir -p "${INSTALL_DIR}/lib" "${INSTALL_DIR}/include" /tmp/office_oxide_unpack
          curl --proto =https --tlsv1.2 -fsSL \
            "https://github.com/yfedoseev/office_oxide/releases/download/${OFFICE_OXIDE_VERSION}/native-linux-x86_64.tar.gz" \
            -o /tmp/office_oxide.tar.gz
          tar -xzf /tmp/office_oxide.tar.gz -C /tmp/office_oxide_unpack
          cp /tmp/office_oxide_unpack/lib/liboffice_oxide.a "${INSTALL_DIR}/lib/liboffice_oxide.a"
          cp -r /tmp/office_oxide_unpack/include/office_oxide_c "${INSTALL_DIR}/include/"
          echo "OFFICE_OXIDE_INSTALL_DIR=${INSTALL_DIR}" >> "$GITHUB_ENV"

      - name: Compose CGO flags
        # Build CGO_CFLAGS / CGO_LDFLAGS from both library install dirs in
        # one step so each prior step can stay focused on a single library.
        run: |
          {
            echo "CGO_CFLAGS=-I${PDF_OXIDE_INSTALL_DIR}/include -I${OFFICE_OXIDE_INSTALL_DIR}/include/office_oxide_c"
            echo "CGO_LDFLAGS=${PDF_OXIDE_INSTALL_DIR}/lib/linux_amd64/libpdf_oxide.a ${OFFICE_OXIDE_INSTALL_DIR}/lib/liboffice_oxide.a -lm -lpthread -ldl -lrt -lgcc_s -lutil -lc"
          } >> "$GITHUB_ENV"

      - name: go vet
        run: go vet ./...

      - name: go test
        # -race catches data races in the fence + rate-limit packages, which is
        # where you'd most want to know. -count=1 disables Go's test result
        # cache so a green CI means the tests actually ran on this revision.
        run: go test -race -count=1 -v ./...

      - name: govulncheck
        # Pinned instead of `@latest` so the scanner version is reproducible;
        # the advisory DATABASE is still fetched fresh at run time, so the daily
        # schedule keeps catching newly published advisories -- pinning the tool
        # does not freeze what it checks against.
        #
        # NOTE: this `go install` version string is not visible to Dependabot
        # (it lives in workflow YAML, not go.mod). To get automated update PRs,
        # promote it to a go.mod `tool` directive:
        #     go get -tool golang.org/x/vuln/cmd/govulncheck@v1.7.0
        # then replace the install line below with `go tool govulncheck ./...`.
        # Left as a follow-up here because it requires regenerating go.sum,
        # which needs Go module network access.
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.7.0
          govulncheck ./...

  build:
    name: Build container (sanity)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Derive build args
        # Same derivation as build.sh -- SOURCE_DATE_EPOCH from the commit,
        # SERVER_VERSION from the tag-or-commit description. On a non-tag
        # build these end up as a commit short-SHA, which is fine for a
        # sanity check (we never push these).
        run: |
          echo "SOURCE_DATE_EPOCH=$(git log -1 --pretty=%ct HEAD)" >> "$GITHUB_ENV"
          echo "SERVER_VERSION=$(git describe --tags --always --dirty)" >> "$GITHUB_ENV"

      - name: Build image (no push)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: false
          load: false
          build-args: |
            SOURCE_DATE_EPOCH=${{ env.SOURCE_DATE_EPOCH }}
            SERVER_VERSION=${{ env.SERVER_VERSION }}
          tags: mcp-searxng-relay:ci
