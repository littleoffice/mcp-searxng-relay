apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-searxng
  labels:
    app: mcp-searxng
spec:
  # Default to one replica + stateful mode (audit-friendly).  See
  # deploy/kubernetes/README.md "Deployment shapes" for when to scale out
  # and what that costs you in session semantics.
  replicas: 1
  selector:
    matchLabels:
      app: mcp-searxng
  template:
    metadata:
      labels:
        app: mcp-searxng
    spec:
      # Pod-level security context.  The container also has its own — see
      # below.  Pod-level controls things like fsGroup that apply across
      # all containers; container-level locks down what each one can do.
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mcp-searxng
          # Pin a specific tag in production rather than tracking :latest —
          # rolling restarts need a known image, and "latest" silently shifts.
          image: ghcr.io/littleoffice/mcp-searxng-relay:sha256-5bf29fa65b9743ad4715b42d22a038e65da5d5475c4fe013774b1d5bcc7d2240
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
            # Uncomment for in-pod TLS (set MCP_PORT to 8443 to match, and
            # point the Service/probes at this port instead of http):
            # - name: https
            #   containerPort: 8443
          env:
            - name: MCP_PORT
              value: "8080"
            - name: MCP_AUTH_TOKEN_FILE
              value: /etc/mcp-auth/tokens
            - name: SEARXNG_URL
              # Replace with your in-cluster SearXNG Service.  The shape
              # below assumes a SearXNG Deployment named "searxng" in the
              # "searxng" namespace serving on port 8080.
              value: http://searxng.searxng.svc.cluster.local:8080
            - name: LOG_FORMAT
              # JSON makes the audit lines parseable by log aggregators
              # without per-deployment regex work.  Drop to "text" if you
              # only ever read logs with kubectl logs.
              value: json
            # Credential for /metrics, from the metrics-token key in the
            # mcp-auth Secret.  Required to scrape: without it /metrics 401s
            # every caller, including ones holding a valid MCP token.  It is
            # deliberately NOT one of the tokens in the tokens file —
            # mcp_fetches_by_domain_total names the destination hosts this
            # relay has fetched across all callers, which no single tenant
            # should be able to read.  Point your ServiceMonitor at this
            # value.  Drop this entry (and the Secret key) if you do not
            # scrape metrics; the endpoint stays closed, which is correct.
            - name: MCP_METRICS_TOKEN
              valueFrom:
                secretKeyRef:
                  name: mcp-auth
                  key: metrics-token
            # Uncomment to switch to stateless mode (see README "Deployment
            # shapes"):
            # - name: MCP_STATELESS
            #   value: "true"
            # Uncomment, together with the fence-key entry in
            # secret.example.yaml, to pin a persistent fence signing key.
            # Two reasons to want this: a verifying gateway can pin one
            # fingerprint instead of re-reading it after every rollout, and
            # all replicas sign with the same key rather than one each.
            # The path below is inside the existing mcp-auth mount, so no
            # extra volume is needed.  See README "Fence signing key".
            # - name: FENCE_SIGNING_KEY_FILE
            #   value: /etc/mcp-auth/fence-key
            # ── In-pod TLS (optional) ──────────────────────────────────────
            # The recommended shape terminates TLS at an Ingress (see
            # ingress.example.yaml) and leaves this pod on plain HTTP. But if
            # you run the relay by itself in a namespace with no Ingress, it
            # can serve HTTPS directly. Uncomment ONE of the two modes below,
            # plus the acme-cache volume/mount and the 443 port further down.
            # See the main README "TLS" section for all MCP_TLS_* variables.
            #
            # Manual cert/key (e.g. a cert-manager Certificate mounted as a
            # Secret at /etc/mcp-tls). Hot-reloaded on renewal, no restart:
            # - name: MCP_TLS_CERT
            #   value: /etc/mcp-tls/tls.crt
            # - name: MCP_TLS_KEY
            #   value: /etc/mcp-tls/tls.key
            #
            # Or automatic certificates via ACME (needs the writable
            # acme-cache volume below; for a private CA also set
            # MCP_TLS_ACME_DIRECTORY and MCP_TLS_ACME_CA_ROOTS):
            # - name: MCP_TLS_ACME
            #   value: "true"
            # - name: MCP_TLS_ACME_DOMAINS
            #   value: relay.example.com
            # - name: MCP_TLS_ACME_EMAIL
            #   value: admin@example.com
            # - name: MCP_TLS_ACME_CACHE_DIR
            #   value: /var/cache/mcp-acme
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: auth
              mountPath: /etc/mcp-auth
              readOnly: true
            # Writable ACME cache for in-pod MCP_TLS_ACME (keeps
            # readOnlyRootFilesystem: true). Not needed for manual-cert TLS.
            # - name: acme-cache
            #   mountPath: /var/cache/mcp-acme
            # Manual-cert TLS mounts the cert Secret here (see MCP_TLS_CERT):
            # - name: tls
            #   mountPath: /etc/mcp-tls
            #   readOnly: true
          # Liveness uses a TCP probe deliberately: the /health endpoint
          # checks the upstream SearXNG, and we don't want a transient
          # SearXNG outage to cascade into K8s killing this pod.  Liveness
          # asks "is the process listening at all"; readiness asks "is it
          # actually able to serve requests".
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
              # If you set MCP_HEALTH_TOKEN to gate /health, this probe must
              # present it too — otherwise every readiness check gets 401 and
              # the Pod never becomes Ready. Uncomment and match the token:
              # httpHeaders:
              #   - name: Authorization
              #     value: Bearer <your-health-token>
              # (The livenessProbe above is a TCP socket check, so it needs no
              # header even when the token is set.)
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              # No CPU limit on purpose — Go's GC and goroutine scheduler
              # do not respond well to CPU throttling and this is a low
              # base-load service.  Memory IS capped because the LRU cache
              # plus session map plus base runtime can drift up.
              memory: 512Mi
      volumes:
        - name: auth
          secret:
            secretName: mcp-auth
            # 0400 = readable only by the container's UID.  Combined with
            # runAsNonRoot + runAsUser:1001 above, this means even if
            # something else ever ran in the pod it couldn't read the
            # token file.
            defaultMode: 0400
        # Writable scratch volume for the ACME cert cache when using in-pod
        # MCP_TLS_ACME (paired with the acme-cache volumeMount above). emptyDir
        # is per-pod and does not survive rescheduling, so certs re-issue on a
        # fresh node — fine for low replica counts; use a PVC if you must avoid
        # re-issuing against a rate-limited CA.
        # - name: acme-cache
        #   emptyDir: {}
        # Certificate Secret for manual-cert in-pod TLS (e.g. produced by a
        # cert-manager Certificate resource):
        # - name: tls
        #   secret:
        #     secretName: mcp-searxng-tls
        #     defaultMode: 0400
