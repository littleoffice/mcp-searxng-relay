# Example MCP_AUTH_TOKEN_FILE Secret.  Do NOT commit a real version of this
# file with real tokens to git — copy it to secret.yaml, replace the placeholder
# values with output from `openssl rand -hex 32`, and apply it once out-of-band.
#
# secret.yaml is deliberately NOT included in kustomization.yaml so that
# `kubectl apply -k .` cannot accidentally roll back a real secret to these
# placeholder values.
apiVersion: v1
kind: Secret
metadata:
  name: mcp-auth
type: Opaque
stringData:
  # The key on the left ("tokens") becomes the filename inside the mount:
  # the Deployment mounts this Secret at /etc/mcp-auth, so the server reads
  # /etc/mcp-auth/tokens.  stringData accepts plaintext; kubectl base64-encodes
  # it server-side at apply time.
  #
  # Each line is `identity:token`.  Identity is any string used only for log
  # correlation; token must be at least 32 characters.  Lines starting with
  # '#' and blank lines are ignored.  See the main README for the full file
  # format including how to do zero-downtime token rotation.
  tokens: |
    alice:REPLACE_ME_64_HEX_CHARS_FROM_openssl_rand_hex_32_xxxxxxxxxxxxxxxxxxxx
    bob:REPLACE_ME_64_HEX_CHARS_FROM_openssl_rand_hex_32_xxxxxxxxxxxxxxxxxxxxxx

  # The bearer token for GET /metrics, referenced by the MCP_METRICS_TOKEN
  # entry in deployment.yaml.  Required to scrape: without it /metrics 401s
  # every caller, including ones holding a valid MCP token.
  #
  # This is a SEPARATE secret from the tokens above and must not reuse one of
  # their values.  The point is that a Prometheus scraper holds a credential
  # that is not a tenant's, and that a tenant's credential does not open
  # /metrics — which lists the destination hosts fetched for every caller.
  #
  # Generate with `openssl rand -hex 32`.  Minimum 32 characters.  If you do
  # not scrape metrics, delete this key and the matching env entry in
  # deployment.yaml; /metrics then stays closed, which is the correct state.
  metrics-token: REPLACE_ME_64_HEX_CHARS_FROM_openssl_rand_hex_32_xxxxxxxxxxxxxxxxxxxx

  # Optional: a persistent Ed25519 fence signing key.  Without one, every pod
  # generates its own at startup and a verifier facing the Service would have
  # to trust each pod's key and re-learn them on every rollout.
  #
  # This lands at /etc/mcp-auth/fence-key inside the container, which is what
  # the commented FENCE_SIGNING_KEY_FILE entry in deployment.yaml points at —
  # the existing mount covers it, so no extra volume is needed.
  #
  # Generate with `openssl genpkey -algorithm ed25519`.  A base64 32-byte seed
  # from `openssl rand -base64 32` works here too; the format is detected.
  # Treat it like any other signing material: it is not rotated automatically.
  # fence-key: |
  #   -----BEGIN PRIVATE KEY-----
  #   REPLACE_ME_WITH_THE_OUTPUT_OF_openssl_genpkey_-algorithm_ed25519
  #   -----END PRIVATE KEY-----
