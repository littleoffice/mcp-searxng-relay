apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# secret.example.yaml is deliberately NOT listed here.  Secrets contain real
# token values that don't belong in source control; apply your own Secret
# (created from secret.example.yaml) out-of-band before `kubectl apply -k .`.
# See deploy/kubernetes/README.md for the full sequence.
resources:
  - deployment.yaml
  - service.yaml

