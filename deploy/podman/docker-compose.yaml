services:
  caddy:
    image: docker.io/caddy:sha256:86deaf5e3d3408a6ccec08fbb79989783dd26e206ae10bcf78a801dc8c9ab794
    container_name: caddy
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    read_only: true
    ports:
      - "443:443"
    volumes:
      - caddy_data:/data:rw
      - caddy_config:/config:rw
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - /etc/ssl/certs/ca-certificates.crt:/etc/ssl/certs/ca-certificates.crt:ro
    networks: [edge]
    depends_on: [searxng, mcp-searxng-relay]
    logging: &log { driver: json-file, options: { max-size: 1m, max-file: "1" } }
    restart: unless-stopped

  mcp-searxng-relay:
    image: ghcr.io/littleoffice/mcp-searxng-relay:sha256-5bf29fa65b9743ad4715b42d22a038e65da5d5475c4fe013774b1d5bcc7d2240
    container_name: mcp-searxng-relay
    env_file: ./envs/.mcp-searxng-relay.env
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    read_only: true
    stdin_open: false
    volumes:
      - /etc/ssl/certs/ca-certificates.crt:/etc/ssl/certs/ca-certificates.crt:ro
    networks: [edge]
    depends_on: [searxng]
    logging: *log
    restart: unless-stopped

  searxng:
    image: docker.io/searxng/searxng:sha256:25ff3c045548971d12726e54bea4564b8ec3bedb3d6951aecdefd01caf840974
    container_name: searxng
    env_file: ./envs/.searxng.env
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    read_only: true
    volumes:
      - ./settings.yml:/etc/searxng/settings.yml
      - core_config:/etc/searxng/
      - core_data:/var/cache/searxng/
    networks: [edge, backend]
    depends_on: [valkey]
    logging: *log
    restart: always

  valkey:
    image: docker.io/valkey/valkey:sha256:d1cc70645bbcef743615463a2fa4616e841407545e18f560aed0c49671a90147
    container_name: valkey
    command: valkey-server --save 30 1 --loglevel warning
    cap_drop: [ALL]
    cap_add:
      - CHOWN
      - FSETID
      - SETUID
      - SETGID
    security_opt: [no-new-privileges:true]
    networks: [backend]
    volumes:
      - valkey_data:/data
    logging: *log
    restart: always

networks:
  edge:
    internal: false
  backend:
    internal: true

volumes:
  valkey_data:
  caddy_data:
  caddy_config:
  core_data:
  core_config:

