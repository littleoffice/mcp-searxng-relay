services:
  caddy:
    image: docker.io/caddy:sha256:86deaf5e3d3408a6ccec08fbb79989783dd26e206ae10bcf78a801dc8c9ab794
    container_name: caddy
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    read_only: true
    ports:
      - "443:443"
    volumes:
      - caddy_data:/data:rw
      - caddy_config:/config:rw
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - /etc/ssl/certs/ca-certificates.crt:/etc/ssl/certs/ca-certificates.crt:ro
    # Caddy shares a network with the gateway, oauth2-proxy and SearXNG only.
    # It has no route to the relay at all, so no Caddyfile edit can expose it.
    networks: [edge]
    depends_on: [searxng, fence-gateway, oauth2-proxy]
    logging: &log { driver: json-file, options: { max-size: 1m, max-file: "1" } }
    restart: unless-stopped

  mcp-searxng-relay:
    image: ghcr.io/littleoffice/mcp-searxng-relay:sha256-5bf29fa65b9743ad4715b42d22a038e65da5d5475c4fe013774b1d5bcc7d2240
    container_name: mcp-searxng-relay
    env_file: ./envs/.mcp-searxng-relay.env
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    read_only: true
    stdin_open: false
    volumes:
      - /etc/ssl/certs/ca-certificates.crt:/etc/ssl/certs/ca-certificates.crt:ro
    # relay:  reachable from the gateway, and from nothing else.
    # search: its private line to SearXNG.
    # egress: its own route out, for fetching URLs.  Shared with nobody, so
    #         being on a non-internal network does not make it reachable.
    networks: [relay, search, egress]
    depends_on: [searxng]
    logging: *log
    restart: unless-stopped

  # Verifies the relay's <sec:fence> signatures before any bytes reach a model,
  # and is what /mcp resolves to at the edge — the relay is no longer routed
  # from outside.  Every client credential is forwarded to the relay unchanged
  # (UPSTREAM_MCP_AUTH_MODE=passthrough), so the relay still tells its callers
  # apart; see README step 4.
  fence-gateway:
    # No release is published yet, so this is built locally — README step 2.
    # Once one exists, pin it by digest like every other image here:
    #   image: ghcr.io/littleoffice/fence-gateway@sha256:...
    image: localhost/fence-gateway:dev
    container_name: fence-gateway
    env_file: ./envs/.fence-gateway.env
    command:
      - -upstream=http://mcp-searxng-relay:3000/mcp
      # reject is the only policy that stops a boundary-escape attack rather
      # than describing it.  annotate and audit are for rollout.
      - -policy=reject
      # Pin the relay's fence key (README step 6).  Required: the key is
      # fetched over plain HTTP from another container, and without a pin the
      # gateway refuses to start rather than trust whoever answers
      # /fence/public-key.
      #- -pin=<16 hex chars>
      #- -max-age=10m
      #- -require-all-fenced   # pair with FENCE_PREAMBLE=fenced on the relay
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    read_only: true
    stdin_open: false
    volumes:
      - /etc/ssl/certs/ca-certificates.crt:/etc/ssl/certs/ca-certificates.crt:ro
    # edge: what Caddy forwards /mcp to.  relay: its only way to the relay.
    # Not on `search`: the gateway has no business talking to SearXNG.
    networks: [edge, relay]
    # Start ordering only.  The gateway gives the relay ~7.5s to answer before
    # exiting; the restart policy covers a relay that takes longer.
    depends_on: [mcp-searxng-relay]
    logging: *log
    restart: unless-stopped

  # Single sign-on in front of the SearXNG web UI.  Caddy asks it, through
  # forward_auth, whether each browser request carries a valid session, and
  # sends anyone without one to your identity provider.  Agents never pass
  # through here: /mcp is bearer-only at the gateway.
  oauth2-proxy:
    # Pin by digest like every other image here (README step 5):
    #   podman pull quay.io/oauth2-proxy/oauth2-proxy:v7 && \
    #   podman image inspect --format '{{index .RepoDigests 0}}' quay.io/oauth2-proxy/oauth2-proxy:v7
    image: quay.io/oauth2-proxy/oauth2-proxy@sha256:CHANGEME
    container_name: oauth2-proxy
    env_file: ./envs/.oauth2-proxy.env
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    read_only: true
    volumes:
      - /etc/ssl/certs/ca-certificates.crt:/etc/ssl/certs/ca-certificates.crt:ro
    # edge only: Caddy asks it, and it reaches your identity provider.  It
    # never proxies to SearXNG itself; Caddy does that once it says yes.
    networks: [edge]
    logging: *log
    restart: unless-stopped

  searxng:
    image: docker.io/searxng/searxng:sha256:25ff3c045548971d12726e54bea4564b8ec3bedb3d6951aecdefd01caf840974
    container_name: searxng
    env_file: ./envs/.searxng.env
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    read_only: true
    volumes:
      - ./settings.yml:/etc/searxng/settings.yml
      - core_config:/etc/searxng/
      - core_data:/var/cache/searxng/
    # edge: Caddy serves the web UI from it, behind oauth2-proxy.
    # search: the relay's private line in.  backend: Valkey.
    networks: [edge, search, backend]
    depends_on: [valkey]
    logging: *log
    restart: always

  valkey:
    image: docker.io/valkey/valkey:sha256:d1cc70645bbcef743615463a2fa4616e841407545e18f560aed0c49671a90147
    container_name: valkey
    command: valkey-server --save 30 1 --loglevel warning
    cap_drop: [ALL]
    cap_add:
      - CHOWN
      - FSETID
      - SETUID
      - SETGID
    security_opt: [no-new-privileges:true]
    networks: [backend]
    volumes:
      - valkey_data:/data
    logging: *log
    restart: always

# Each network is one trust boundary.  Who shares a network with whom is the
# whole access-control story for this stack: a container can only connect to
# the containers it shares a network with.
#
#   edge     caddy, fence-gateway, oauth2-proxy, searxng   what Caddy can reach
#   relay    fence-gateway, mcp-searxng-relay              the only way to the relay
#   search   mcp-searxng-relay, searxng                    the relay's line to SearXNG
#   egress   mcp-searxng-relay                             the relay's own route out
#   backend  searxng, valkey                               SearXNG's cache
networks:
  edge:
    internal: false
  relay:
    internal: true
  search:
    internal: true
  egress:
    internal: false
  backend:
    internal: true

volumes:
  valkey_data:
  caddy_data:
  caddy_config:
  core_data:
  core_config:

